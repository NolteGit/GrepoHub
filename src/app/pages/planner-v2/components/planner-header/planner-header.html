<header class="flex justify-center px-4 py-3">
  <div
    class="grid w-full max-w-[44rem] items-end gap-2 min-[36rem]:grid-cols-[minmax(13rem,1fr)_repeat(4,2.75rem)]"
  >
    <app-gh-select-field
      [ariaLabel]="planLabelKey | translate: planLabelFallback"
      [value]="activePlanId()"
      [options]="planOptions()"
      size="lg"
      (valueChange)="planSelected.emit($event)"
    />

    @for (action of actions(); track action.id) {
      <app-gh-button
        size="lg"
        [variant]="action.variant === 'primary' ? 'primary' : 'default'"
        [wide]="true"
        [disabled]="action.disabled ?? false"
        [ariaLabel]="action.labelKey | translate: action.fallback"
        (click)="actionSelected.emit(action.id)"
      >
        <span class="text-base leading-none text-[var(--gh-gold)]" aria-hidden="true">{{
          action.icon
        }}</span>
      </app-gh-button>
    }
  </div>
</header>
