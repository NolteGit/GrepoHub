<header
  class="relative grid min-h-[4.25rem] grid-cols-[auto_minmax(0,1fr)] items-center gap-3 px-5 py-2 max-[64rem]:grid-cols-[auto_minmax(0,1fr)] max-[58rem]:grid-cols-1 max-[58rem]:gap-2 max-[58rem]:px-3"
>
  <div
    class="hidden min-w-0 select-none font-serif text-[2rem] leading-none tracking-[0.02em] text-[var(--gh-gold)] drop-shadow-[0_0_10px_rgba(212,160,55,0.18)] min-[58rem]:block"
    aria-hidden="true"
  >
    {{ brandLabelKey | translate: brandLabelFallback }}
  </div>

  <div
    class="flex min-w-0 flex-wrap items-center justify-end gap-2 max-[64rem]:col-span-2 max-[64rem]:row-start-1 max-[58rem]:col-span-1 max-[58rem]:row-auto max-[58rem]:justify-center"
  >
    <div class="min-w-[13rem] flex-1 max-[38rem]:min-w-full min-[46rem]:max-w-[23rem]">
      <app-gh-select-field
        [ariaLabel]="planLabelKey | translate: planLabelFallback"
        [value]="activePlanId()"
        [options]="planOptions()"
        size="lg"
        (valueChange)="planSelected.emit($event)"
      />
    </div>

    <app-gh-button
      size="lg"
      variant="primary"
      [ariaLabel]="newPlanLabelKey | translate: newPlanLabelFallback"
      (click)="actionSelected.emit('new')"
    >
      <svg
        class="size-4 text-[var(--gh-gold)]"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <rect width="12" height="12" x="8" y="8" rx="2" />
        <path d="M4 16c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2h8c1.1 0 2 .9 2 2" />
      </svg>
      <span>{{ newPlanLabelKey | translate: newPlanLabelFallback }}</span>
    </app-gh-button>

    <app-gh-button
      size="lg"
      [ariaLabel]="exportLabelKey | translate: exportLabelFallback"
      (click)="actionSelected.emit('export')"
    >
      <svg
        class="size-4 text-[var(--gh-gold)]"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
        <path d="m17 8-5-5-5 5" />
        <path d="M12 3v12" />
      </svg>
      <span>{{ exportLabelKey | translate: exportLabelFallback }}</span>
    </app-gh-button>

    <details #moreMenu class="group relative">
      <summary
        class="gh-button inline-flex min-h-11 cursor-pointer list-none items-center justify-center gap-2 rounded-md px-4 font-bold transition marker:hidden [&::-webkit-details-marker]:hidden"
        [attr.aria-label]="moreLabelKey | translate: moreLabelFallback"
      >
        <span>{{ moreLabelKey | translate: moreLabelFallback }}</span>
        <span class="text-xs leading-none text-[var(--gh-gold)]" aria-hidden="true">▾</span>
      </summary>

      <div
        class="absolute right-0 z-30 mt-2 grid min-w-[12rem] overflow-hidden rounded-xl border border-[var(--gh-border)] bg-[rgba(2,16,29,0.98)] p-1 shadow-2xl shadow-black/40"
      >
        @for (action of menuActions(); track action.id) {
          <button
            type="button"
            class="inline-flex min-h-10 cursor-pointer items-center gap-3 rounded-lg border-0 bg-transparent px-3 text-left text-sm font-black tracking-[0.02em] text-[var(--gh-text)] transition hover:bg-[rgba(212,160,55,0.1)] hover:text-[var(--gh-gold)] disabled:cursor-not-allowed disabled:opacity-45"
            [class.text-red-200]="action.tone === 'danger'"
            [disabled]="action.disabled ?? false"
            (click)="moreMenu.open = false; actionSelected.emit(action.id)"
          >
            <span class="grid size-4 place-items-center text-[var(--gh-gold)]" aria-hidden="true">
              @switch (action.icon) {
                @case ('save') {
                  <svg
                    class="size-4"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  >
                    <path
                      d="M15.2 3a2 2 0 0 1 1.4.6l3.8 3.8A2 2 0 0 1 21 8.8V19a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z"
                    />
                    <path d="M17 21v-7H7v7" />
                    <path d="M7 3v5h8" />
                  </svg>
                }
                @case ('note') {
                  <svg
                    class="size-4"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  >
                    <path
                      d="M15.2 3a2 2 0 0 1 1.4.6l3.8 3.8A2 2 0 0 1 21 8.8V19a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z"
                    />
                    <path d="M17 21v-7H7v7" />
                    <path d="M7 3v5h8" />
                  </svg>
                }
                @case ('import') {
                  <svg
                    class="size-4"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  >
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
                    <path d="m7 10 5 5 5-5" />
                    <path d="M12 15V3" />
                  </svg>
                }
                @case ('trash') {
                  <svg
                    class="size-4"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  >
                    <path d="M3 6h18" />
                    <path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" />
                    <path d="M19 6 18 20a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6" />
                    <path d="M10 11v6" />
                    <path d="M14 11v6" />
                  </svg>
                }
                @case ('eraser') {
                  <svg
                    class="size-4"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  >
                    <path
                      d="m7 21-4.3-4.3a2.4 2.4 0 0 1 0-3.4L13.3 2.7a2.4 2.4 0 0 1 3.4 0l4.6 4.6a2.4 2.4 0 0 1 0 3.4L11 21"
                    />
                    <path d="M22 21H7" />
                    <path d="m5 12 7 7" />
                  </svg>
                }
              }
            </span>
            <span>{{ action.labelKey | translate: action.fallback }}</span>
          </button>
        }
      </div>
    </details>
  </div>
</header>
